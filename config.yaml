project:
  seed: 20260804
  demo_mode: true
  concentration_unit: mM
data:
  spectra: data/experimental_spectra.csv
  metadata: data/sample_metadata.csv
  blanks: data/blank_measurements.csv
  external: data/external_validation.csv
  results_dir: data/results
preprocessing:
  wavelength_min_nm: 600.0
  wavelength_max_nm: 900.0
  baseline_degree: 2
  savgol_window: 11
  savgol_order: 3
validation:
  group_column: batch_id
  folds: 5
  bootstrap_iterations: 1000
  alpha: 0.05
  external_batch_required: false
model:
  classical: [linear, ridge, random_forest]
  cnn_enabled: false
  epochs: 150
  patience: 15
  dropout: 0.30
  learning_rate: 0.001
  batch_size: 64
robustness:
  noise_sd: [0.002, 0.005, 0.01]
  wavelength_shift_nm: [-0.5, 0.5]
  baseline_slope: [-0.01, 0.01]
